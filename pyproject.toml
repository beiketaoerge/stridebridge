[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "stridebridge"
version = "0.2.0"
description = "Locomotion and motion imitation policy switching for Unitree H1 and G1"
requires-python = ">=3.8"
dependencies = ["numpy>=1.24", "PyYAML>=6", "mujoco>=3.2.3,<4", "scipy>=1.10", "onnxruntime>=1.19", "imageio>=2.31", "imageio-ffmpeg>=0.4", "Pillow>=9"]

[project.optional-dependencies]
h1 = ["torch>=2.4"]
# SDK2 also needs an editable source install to retain its CRC libraries; see docs/dds.md.
dds = ["cyclonedds==0.10.2"]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["stridebridge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
